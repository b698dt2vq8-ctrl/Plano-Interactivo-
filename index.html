<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de máquinas – croquis</title>
<style>
  :root{ --ink:#1E2B34; --paper:#DDE1E3; --sel:#0B6BCB; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;}
  header{padding:14px 18px 6px}
  header h1{margin:0;font-size:20px;font-weight:600}
  header p{margin:2px 0 0;font-size:13px;color:#51606b}
  main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;padding:10px 18px 24px;align-items:start}
  .plan{background:#fff;border:1px solid #c4cbd0;border-radius:6px;padding:6px;overflow-x:auto}
  svg#plan{width:100%;min-width:760px;height:auto;display:block}
  .eq{cursor:pointer;outline:none}
  .eq .hit{fill:transparent;stroke:transparent;stroke-width:2}
  .eq:hover .hit,.eq:focus-visible .hit{stroke:#8aa4b8;stroke-dasharray:4 3}
  .eq.sel .hit{stroke:var(--sel);stroke-width:3;stroke-dasharray:none;fill:rgba(11,107,203,.10)}
  .eq.pend .shape *{stroke-dasharray:5 3}
  .lbl{font-size:15px;font-weight:600;fill:var(--ink);pointer-events:none}
  .grp{font-size:15px;font-style:italic;fill:#51606b}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 4px 4px;font-size:13px;color:#33424d}
  .legend .lg{display:flex;align-items:center;gap:6px}
  aside{background:#fff;border:1px solid #c4cbd0;border-radius:6px;padding:14px 16px;position:sticky;top:10px}
  aside h2{margin:0 0 2px;font-size:17px}
  aside .code{font-size:13px;color:#51606b;margin-bottom:10px}
  aside dl{margin:0;font-size:14px}
  aside dt{font-size:12px;color:#6a7780;margin-top:10px}
  aside dd{margin:1px 0 0}
  aside .empty{font-size:14px;color:#51606b;line-height:1.45}
  .note{margin-top:12px;padding-top:10px;border-top:1px solid #e1e5e8;font-size:12px;color:#6a7780}
  @media (max-width:820px){ main{grid-template-columns:1fr} aside{position:static} }
  /* vista del panel */
  #modal{position:fixed;inset:0;background:rgba(20,28,34,.58);display:none;z-index:50;padding:14px;overflow:auto}
  #modal.open{display:block}
  .mbox{background:#fff;border-radius:10px;max-width:1000px;margin:0 auto;padding:14px 16px 18px}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mhead h2{margin:0;font-size:18px}
  .mhead button{border:0;background:#e9edf0;border-radius:8px;font-size:18px;width:38px;height:38px;cursor:pointer}
  .mtabs{display:flex;gap:8px;margin:12px 0}
  .mtabs button{flex:1;border:1px solid #c4cbd0;background:#f3f5f6;border-radius:8px;padding:9px 6px;font-size:15px;cursor:pointer;color:#33424d}
  .mtabs button.on{background:#1E2B34;color:#fff;border-color:#1E2B34}
  .mbody{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
  #mview{background:#eef0f1;border-radius:8px;padding:8px;display:flex;justify-content:center}
  #mview svg{width:100%;height:auto;max-height:68vh}
  #minfo{border:1px solid #d4dadd;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.45}
  #minfo h3{margin:0 0 6px;font-size:16px}
  #minfo p{margin:0 0 6px}
  #minfo .small{font-size:12px;color:#6a7780}
  .part{cursor:pointer;outline:none}
  .part .phit{fill:transparent;stroke:transparent;stroke-width:2}
  .part:hover .phit,.part:focus-visible .phit{stroke:#8aa4b8;stroke-dasharray:4 3}
  .part.sel .phit{stroke:#0B6BCB;stroke-width:3;stroke-dasharray:none;fill:rgba(11,107,203,.12)}
  @media (max-width:820px){ .mbody{grid-template-columns:1fr} #modal{padding:0} .mbox{border-radius:0;min-height:100%} }
  .mback{border:1px solid #c4cbd0;background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:8px;cursor:pointer;color:#1E2B34}
</style>
</head>
<body>
<header>
  <h1>Sala de máquinas</h1>
  <p>Toca un equipo para ver su ficha. Los de trazo discontinuo están pendientes de confirmar.</p>
</header>
<main>
  <div class="plan">
    <svg id="plan" viewBox="0 0 1100 877" role="img" aria-label="Croquis de la sala de máquinas">
      <defs>
        <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
          <line x1="0" y1="0" x2="0" y2="10" stroke="#51606b" stroke-width="2.5"/>
        </pattern>
      </defs>

      <!-- sala en forma de L (la esquina de arriba a la izquierda queda fuera) -->
      <polygon points="275,20 1080,20 1080,857 20,857 20,446 275,446" fill="#F1EEEA" stroke="#1E2B34" stroke-width="5" stroke-linejoin="round"/>

      <!-- muro rayado (no es parte de la sala, no clicable) -->
      <rect x="880" y="508" width="198" height="35" fill="url(#hatch)" stroke="#1E2B34" stroke-width="2"/>

      <!-- cuarto de limpieza (se abre por fuera; no es parte de la sala, no clicable) -->
      <rect x="643" y="764" width="165" height="93" fill="#E3E0DC" stroke="#1E2B34" stroke-width="2"/>
      <text class="grp" x="725" y="806" text-anchor="middle">Cuarto de limpieza</text>
      <text class="grp" x="725" y="826" text-anchor="middle" style="font-size:13px">(abre por fuera)</text>

      <!-- puerta (base sobre la pared de abajo) -->
      <path d="M384 779 A78 78 0 0 1 462 857 L384 857 Z" fill="#fff" stroke="#1E2B34" stroke-width="2.5"/>
      <text class="grp" x="392" y="846">Puerta</text>

      <g id="items"></g>
      <path d="M643 668 L643 663 L808 663 L808 668" fill="none" stroke="#1E2B34" stroke-width="2"/>
      <text class="lbl" x="725" y="652" text-anchor="middle" style="font-size:17px">PGD</text>
    </svg>
    <div class="legend" id="legend"></div>
  </div>
  <aside id="panel" aria-live="polite">
    <p class="empty">Haz clic en una bomba, panel, tanque o cualquier otro equipo para ver su información.</p>
  </aside>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbox">
    <div class="mhead"><h2 id="mtitle"></h2><button id="mclose" aria-label="Cerrar">✕</button></div>
    <div class="mtabs">
      <button data-tab="out" class="on">Por fuera</button>
      <button data-tab="door" style="display:none">Detrás de la puerta</button>
      <button data-tab="in">Por dentro</button>
    </div>
    <div class="mbody">
      <div id="mview"></div>
      <div id="minfo"></div>
    </div>
  </div>
</div>

<script>
const INK = "#1E2B34", COLD = "#2F6FB5", HOT = "#D23B2E";
const st = `stroke="${INK}" stroke-width="2"`;
const GP = "Primaria de H₂O fría", GS = "Secundaria de H₂O fría";
const SIN_NUM = "En el plano todavía no tiene número.";
const PGD_NOTA = "Los 3 paneles juntos forman el PGD y a la vez son paneles de control. Código de cada panel por definir.";
const PLACA_MOTOR = [
  ["Fabricante","Grundfos (Bjerringbro, Dinamarca)"],
  ["Modelo del motor","MG160LB4-42FF300-H3 · trifásico, 4 polos"],
  ["Nº de motor","87420012"],
  ["Nº de serie","6562 (de la placa fotografiada)"],
  ["Potencia","15,0 kW"],
  ["Conexión","D/Y (triángulo / estrella)"],
  ["A 50 Hz","220–240 V (D) / 380–415 V (Y) · 50,0–48,5 A (D) / 29,0–28,0 A (Y) · 1460–1470 rpm · cos φ 0,86–0,82 · IE3 92,1 %"],
  ["A 60 Hz","220–277 V (D) / 380–480 V (Y) · 50,0–42,0 A (D) / 29,0–24,2 A (Y) · 1760–1770 rpm · cos φ 0,88–0,81 · IE2 91,0 % – IE3 93,0 %"],
  ["Corriente máxima","50 Hz: 55,5–53,5 A (D) / 32,0–31,0 A (Y) · 60 Hz: 55,5–46,0 A (D) / 32,0–26,6 A (Y)"],
  ["Servicio / norma","S1 · IEC 60034"],
  ["Clase térmica / protección","Clase F · IP55 · protector PTC 160 °C"],
  ["Peso","131 kg"],
  ["Rodamientos","6309.Z.C4 (lado accionamiento y lado opuesto)"],
  ["Grasa","UNIREX N3, 13 g · cada 10 000 h a 40 °C o cada 2 500 h a 60 °C"],
  ["Código de producción","1748"],
  ["Origen","Hecho en Hungría"]
];
const NOTA_PLACA = "Datos de la placa del motor. Falta la placa de la bomba (caudal y altura). El nº de serie es el de la placa fotografiada; falta confirmar a cuál bomba corresponde.";
const PLACA_CALENTADOR = [
  ["Fabricante","Sedical, S.A. (Sondika, Bizkaia, España)"],
  ["Tipo","UFP-61/16 MH"],
  ["Nº de fabricación","49095/18 (de la placa fotografiada)"],
  ["Potencia","200 kW"],
  ["Distancia interior de apriete (A)","40,80 mm"],
  ["Fluido","Agua en los dos circuitos"],
  ["Circuito 1","Presión máx. 10 bar · temp. máx. 110 °C · trabajo 80 °C entrada / 70 °C salida · conexiones F1 (entrada) – F4 (salida)"],
  ["Circuito 2","Presión máx. 10 bar · temp. máx. 110 °C · trabajo 20 °C entrada / 60 °C salida · conexiones F3 (entrada) – F2 (salida)"],
  ["Normativa","Fabricado según la DEP 2014/68/UE, artículo 4.3"],
  ["Avisos de la placa","No montarlo con una distancia de apriete (A) menor a la indicada; si tiene fugas al apretar a esa medida, contactar al suministrador. La puesta en marcha debe hacerse sin golpes de ariete."],
  ["Contacto del fabricante","Pol. Ind. Berreteaga, Pab. 12 · tel. 944 710 460 · sedical@sedical.com"]
];
const NOTA_CALENTADOR = "Datos de la placa del intercambiador. Por las temperaturas, el circuito 1 (80/70 °C) parece el primario y el circuito 2 (20/60 °C) el secundario, donde el agua se calienta de 20 a 60 °C. Los stickers del equipo dicen «entrada/salida primario» y «entrada/salida secundario». El nº de fabricación es el de la placa fotografiada; falta confirmar a cuál calentador corresponde.";

/* ---------- Datos de los equipos (editar aquí) ---------- */
function P(id,x,y,w,extra){return Object.assign({id,t:"pump",x,y,w,h:w,lp:"r",tipo:"Bomba"},extra)}
const PGD_NOTA1 = "Primera puerta del PGD contando de derecha a izquierda, de frente al PGD. Los 3 paneles juntos forman el PGD y a la vez son paneles de control. Se abre una vista por fuera, detrás de la puerta y por dentro.";
function PGD(n,x){return {id:"PGD-"+n, lbl:"PC-", t:"pc", vista:(n===1?1:undefined), x, y:709, w:55, h:55, lp:"a", lo:5, nombre:"PGD – panel "+n+" de 3", tipo:"Panel de control (parte del PGD)", grupo:"PGD", marca:"Schneider Electric", notas:(n===1?PGD_NOTA1:PGD_NOTA)}}

const items = [
  /* Secundaria de H2O fría (columna) */
  P("B-09",316,32,64,{grupo:GS,nombre:"Bomba 9"}),
  P("B-08",316,109,64,{grupo:GS,nombre:"Bomba 8"}),
  P("B-07",316,186,64,{grupo:GS,nombre:"Bomba 7"}),
  P("B-06",316,263,64,{grupo:GS,nombre:"Bomba 6"}),
  P("B-05",316,340,64,{grupo:GS,nombre:"Bomba 5"}),
  P("B-04",316,417,64,{grupo:GS,nombre:"Bomba 4"}),

  /* Columna de los calentadores: B-11, 3 calentadores, B-10 y 2 paneles */
  P("B-11",538,153,64,{lp:"l",nombre:"Bomba 11",notas:"Está arriba de los calentadores."}),
  {id:"C-01", t:"heater", x:543,y:225,w:55,h:55, lp:"l", nombre:"Calentador 1", tipo:"Calentador (intercambiador de placas)", marca:"Sedical UFP-61/16 MH, 200 kW", datos:PLACA_CALENTADOR, notas:NOTA_CALENTADOR},
  {id:"C-02", t:"heater", x:543,y:289,w:55,h:55, lp:"l", nombre:"Calentador 2", tipo:"Calentador (intercambiador de placas)", marca:"Sedical UFP-61/16 MH, 200 kW", datos:PLACA_CALENTADOR, notas:NOTA_CALENTADOR},
  {id:"C-03", t:"heater", x:543,y:353,w:55,h:55, lp:"l", nombre:"Calentador 3", tipo:"Calentador (intercambiador de placas)", marca:"Sedical UFP-61/16 MH, 200 kW", datos:PLACA_CALENTADOR, notas:NOTA_CALENTADOR},
  P("B-10",538,417,64,{lp:"l",nombre:"Bomba 10",notas:"Está debajo de los calentadores."}),
  {id:"PC-a1", lbl:"PC-", t:"pc", pend:1, x:543,y:495,w:55,h:55, lp:"l", nombre:"Panel de control sin número (1 de 2)", tipo:"Panel de control", notas:SIN_NUM},
  {id:"PC-a2", lbl:"PC-", t:"pc", pend:1, x:543,y:551,w:55,h:55, lp:"l", nombre:"Panel de control sin número (2 de 2)", tipo:"Panel de control", notas:SIN_NUM},

  /* Tanques */
  {id:"T-01", t:"tank", x:621,y:181,w:98,h:440, nombre:"Tanque 1", tipo:"Tanque de agua"},
  {id:"T-03", t:"tank", x:726,y:181,w:98,h:216, nombre:"Tanque 3", tipo:"Tanque de agua"},
  {id:"T-02", t:"tank", x:726,y:405,w:98,h:216, nombre:"Tanque 2", tipo:"Tanque de agua"},

  /* Sistema contra incendios */
  {id:"MD-01", t:"diesel", x:904,y:93,w:136,h:132, lp:"l", nombre:"Motobomba contra incendios", tipo:"Motobomba diésel del sistema contra incendios", notas:"Motor diésel con radiador y batería de arranque."},
  {id:"TCI", t:"tank", x:919,y:229,w:104,h:46, nombre:"Tanque contra incendio", tipo:"Tanque contra incendio (TCI)"},

  /* Bombas de la derecha */
  P("B-15",1018,334,54,{lp:"l",nombre:"Bomba 15"}),
  P("B-14",1018,392,54,{lp:"l",nombre:"Bomba 14"}),
  P("B-13",979,452,54,{lp:"as",nombre:"Bomba 13"}),
  P("B-12",904,452,54,{lp:"l",nombre:"Bomba 12"}),

  /* Descalcificadores */
  {id:"DC-01", t:"trileft", col:HOT, x:972,y:590,w:75,h:92, lp:"b", nombre:"Descalcificador de agua caliente", tipo:"Descalcificador de agua caliente", notas:"Código provisional."},
  {id:"DA-01", t:"tri", col:COLD, x:883,y:731,w:77,h:77, lp:"b", nombre:"Descalcificador de agua fría", tipo:"Descalcificador de agua fría", notas:"Código provisional."},

  /* PGD: 3 paneles de control juntos */
  PGD(1,643), PGD(2,698), PGD(3,753),

  /* Paneles junto a la entrada */
  {id:"PC-04", lbl:"PC-04", t:"pc", vista:1, x:518,y:799,w:55,h:56, lp:"a", nombre:"Panel de control PC-04", tipo:"Panel de control con variador de frecuencia", marca:"ABB (variador)", notas:"Está a la derecha de la puerta, junto a PC-05. Se abre una vista del panel por fuera y por dentro."},
  {id:"PC-05", lbl:"PC-05", t:"pc", vista:1, x:573,y:799,w:55,h:56, lp:"a", nombre:"Panel de control PC-05", tipo:"Panel de control con variador de frecuencia", marca:"ABB (variador)", notas:"Está a la derecha de la puerta, junto a PC-04. Se abre una vista del panel por fuera y por dentro."},

  /* Primaria de H2O fría + paneles (filas alineadas) */
  P("B-03",119,545,66,{grupo:GP,nombre:"Bomba 3",marca:"Grundfos (motor MG160LB4-42FF300-H3, 15 kW)",datos:PLACA_MOTOR,notas:NOTA_PLACA}),
  P("B-02",119,642,66,{grupo:GP,nombre:"Bomba 2",marca:"Grundfos (motor MG160LB4-42FF300-H3, 15 kW)",datos:PLACA_MOTOR,notas:NOTA_PLACA}),
  P("B-01",119,739,66,{grupo:GP,nombre:"Bomba 1",marca:"Grundfos (motor MG160LB4-42FF300-H3, 15 kW)",datos:PLACA_MOTOR,notas:NOTA_PLACA}),
  {id:"PC-03", t:"pc", vista:1, x:44,y:548,w:60,h:60, lp:"b", nombre:"Panel de control PC-03", tipo:"Panel de control de bombas (con variador)", marca:"Danfoss (variador)", grupo:GP, notas:"Maneja 2 bombas: «Bomba N°1» y «Bomba N°2». Se abre una vista del panel por fuera y por dentro."},
  {id:"PC-02", t:"pc", vista:1, x:44,y:645,w:60,h:60, lp:"b", nombre:"Panel de control PC-02", tipo:"Panel de control de bombas (con variador)", marca:"Danfoss (variador)", grupo:GP, notas:"Maneja 2 bombas: «Bomba N°1» y «Bomba N°2». Se abre una vista del panel por fuera y por dentro."},
  {id:"PC-01", t:"pc", vista:1, x:44,y:742,w:60,h:60, lp:"b", nombre:"Panel de control PC-01", tipo:"Panel de control de bombas (con variador)", marca:"Danfoss (variador)", grupo:GP, notas:"Maneja 2 bombas: «Bomba N°1» y «Bomba N°2». Se abre una vista del panel por fuera y por dentro."}
];

/* ---------- Símbolos ---------- */
function pumpCircle(cx,cy,r){
  const k=r/19;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" ${st}/>
    <polygon points="${cx-8*k},${cy-10*k} ${cx-8*k},${cy+10*k} ${cx+11*k},${cy}" fill="${INK}"/>`;
}
function xcell(x,y,w,h){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" ${st}/>
    <line x1="${x}" y1="${y}" x2="${x+w}" y2="${y+h}" ${st}/><line x1="${x+w}" y1="${y}" x2="${x}" y2="${y+h}" ${st}/>`;
}
const shapes = {
  pump:i=>pumpCircle(i.w/2,i.h/2,i.w/2-1),
  pc:i=>xcell(0,0,i.w,i.h),
  heater:i=>{const m=Math.max(8,i.w*0.17),r=Math.max(2.5,i.w*0.06);
    const c=(x,y)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${st}/>`;
    return `<rect width="${i.w}" height="${i.h}" fill="#fff" ${st}/>${c(m,m)}${c(i.w-m,m)}${c(m,i.h-m)}${c(i.w-m,i.h-m)}`;},
  tank:i=>`<rect width="${i.w}" height="${i.h}" rx="${Math.min(18,i.w*0.25)}" fill="#fff" ${st}/>
    <text x="${i.w/2}" y="${i.h/2+6}" text-anchor="middle" font-size="${i.h>60?20:18}" font-weight="600" fill="${INK}">${i.id||""}</text>`,
  diesel:i=>{const cy=i.h*0.48,cx=i.w*0.74,r=Math.max(10,i.w*0.1),ix=i.w*0.08,iw=i.w*0.43;
    return `<rect width="${i.w}" height="${i.h}" fill="#fff" ${st}/>
    <rect x="${ix}" y="${i.h*0.08}" width="${iw}" height="${i.h*0.84}" fill="#fff" ${st}/>
    <text x="${ix+iw/2}" y="${cy+8}" text-anchor="middle" font-size="24" font-weight="600" fill="${INK}">D</text>
    <line x1="${ix+iw}" y1="${cy}" x2="${cx-r}" y2="${cy}" ${st}/>
    ${pumpCircle(cx,cy,r)}`;},
  tri:i=>`<polygon points="0,${i.h} ${i.w},${i.h} ${i.w/2},0" fill="#fff" ${st}/>
    <text x="${i.w/2}" y="${i.h-8}" text-anchor="middle" font-size="${Math.max(12,i.h*0.36)}" font-weight="700" fill="${i.col}">D</text>`,
  trileft:i=>`<polygon points="${i.w},0 ${i.w},${i.h} 0,${i.h/2}" fill="#fff" ${st}/>
    <text x="${i.w*0.64}" y="${i.h/2+Math.max(12,i.w*0.36)*0.35}" text-anchor="middle" font-size="${Math.max(12,i.w*0.36)}" font-weight="700" fill="${i.col}">D</text>`
};

/* ---------- Dibujo ---------- */
function label(i){
  const t = (i.lbl===undefined) ? i.id : i.lbl;
  if(!t) return "";
  const pos = {
    r:`x="${i.w+8}" y="${i.h/2+5}" text-anchor="start"`,
    l:`x="-8" y="${i.h/2+5}" text-anchor="end"`,
    a:`x="${i.w/2}" y="${-(i.lo||8)}" text-anchor="middle"`,
    as:`x="0" y="-8" text-anchor="start"`,
    b:`x="${i.w/2}" y="${i.h+18}" text-anchor="middle"`
  }[i.lp||"b"];
  return `<text class="lbl" ${pos}>${t}</text>`;
}
const root = document.getElementById("items");
root.innerHTML = items.map(i=>{
  const noLabel = i.t==="tank";
  return `
  <g class="eq${i.pend?" pend":""}" data-id="${i.id}" tabindex="0" role="button"
     aria-label="${i.nombre}" transform="translate(${i.x},${i.y})">
    <rect class="hit" x="-6" y="-6" width="${i.w+12}" height="${i.h+12}" rx="4"/>
    <g class="shape">${shapes[i.t](i)}</g>
    ${noLabel?"":label(i)}
  </g>`;}).join("");

/* ---------- Leyenda ---------- */
const leg = [
  ["Bombas",     {t:"pump",w:30,h:30}],
  ["Pizarra de control", {t:"pc",w:26,h:26}],
  ["Calentadores", {t:"heater",w:28,h:28}],
  ["Tanques de agua", {t:"tank",w:20,h:32,id:""}],
  ["Descalcificador de agua fría", {t:"tri",w:30,h:28,col:COLD}],
  ["Descalcificador de agua caliente", {t:"trileft",w:30,h:30,col:HOT}]
];
document.getElementById("legend").innerHTML = leg.map(([n,o])=>
  `<span class="lg"><svg width="${o.w+6}" height="${o.h+6}" viewBox="-3 -3 ${o.w+6} ${o.h+6}">${shapes[o.t](o)}</svg>${n}</span>`).join("");

/* ---------- Ficha al hacer clic ---------- */
const panel = document.getElementById("panel");
function show(id){
  const i = items.find(e=>e.id===id);
  const code = (i.lbl===undefined || i.lbl==="") ? i.id : i.lbl;
  document.querySelectorAll(".eq").forEach(g=>g.classList.toggle("sel", g.dataset.id===id));
  panel.innerHTML = `
    <h2>${i.nombre}</h2>

function showTab(t){
  inDrive=false;
  tab=t;
  const P=PANELS[curId];
  document.querySelectorAll(".mtabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  mview.innerHTML = t==="out" ? P.out() : t==="door" ? P.door() : P.inn();
  const lab=(P.labels&&P.labels[t]) || (t==="out"?"Frente del panel.":t==="door"?"Parte de atrás de la puerta.":"Interior de los dos paneles.");
  minfo.innerHTML = `<p class="small">${lab} Toca una parte para ver qué es.</p>`;
}
